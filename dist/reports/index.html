ant": false}, {"order": 24, "is_pick": true, "hero_id": 98, "is_radiant": true}], "editorial": {"match_id": 9036337523, "title": "Lina 28 杀，首局直接开火", "subtitle": "10 月 9 日 20:23 · 夜魇获胜 · 41:29 · 70:34", "lead": "天辉打出了几次漂亮交换，地图却一直缩水。夜魇真正凶的地方，是 Lina 和兽的火力后面，还有刚背拿盾、多人接力拆楼。", "bp_commentary": ["第 8 条夜魇首选拉比克，第 9 条天辉回应 Lion；两边随后补屠夫／兽、Lich／剑圣。阵容已经显出差别：夜魇有更多近身压迫点，天辉需要把控制和核心输出接起来。", "第 17、18 条分别是破晓辰星与刚背兽，末段再禁火猫、猴子、死灵法、拍拍熊。禁用顺序能核对，不能把每手都说成某个玩家的针对计划。", "第 23 条夜魇补 Lina，第 24 条天辉补伐木机。作为阵容解读，夜魇有稳定远程火力配多名前排，天辉有回复／支援与控制；实战里 Lina 的 65,078 伤害说明这台火力机确实启动了。"], "key_moments": [{"time": "25:58—26:40", "title": "换到人头，外塔还是没了", "event": "七次阵亡中，Lina 收掉勇敢牛牛、噗噗猪、不怪她、4ever4Seven；26:29 天辉第三座二塔倒下。", "comment": "天辉的剑圣和伐木机也各有击杀，但夜魇把这段交换转成了地图收益。人头来回换，房子却只往一边掉。"}, {"time": "34:18—34:41", "title": "先减员，再拿盾，再补买活", "event": "夜魇先杀天辉三人，34:25 肉山倒下，34:26 刚背拿盾；Lina 34:40 阵亡、34:41 买活。", "comment": "夜魇让肉山收益落到了能参与推进的前排身上，主输出随后买活接上。这是高地压力连续出现的可核对转折。"}, {"time": "35:25—36:33", "title": "八次死亡，买活也没止血", "event": "Lina 拿三个人头、刚背拿两个人头；不怪她 36:09 买活，36:33 再被刚背击杀。", "comment": "天辉确实击杀了拉比克和兽，仍付出更多阵亡。双命投入后地图没变宽，防守成本只变高。"}, {"time": "37:00—37:19", "title": "上下两路一起交物业", "event": "天辉上下两路四座兵营在十九秒内全部倒下。", "comment": "首局最决定性的不是某一条华丽击杀提示，而是夜魇把长时间火力优势兑现成两路超级兵。"}, {"time": "41:05—41:30", "title": "最后五人清场", "event": "兽与 Lina 收掉天辉五人，随后基地倒下；末尾建筑事件比终局时长晚约一秒。", "comment": "这次防守没有第二段，Lina 三杀、兽两杀，把 70:34 的结算正式盖章。"}], "mvp": {"label": "俱乐部 MVP · 可调整", "selected_slot": 130, "selection_reason": "Lina 28/3/21，65,078 英雄伤害、7,692 建筑伤害；输出、关键击杀、推进贡献三项同时有证据。34:41 买活后继续参与破路和终局清场，首局最完整的贡献链。", "candidates": [{"player_slot": 130, "role": "主导火力", "reason": "Lina 28/3/21，英雄伤害全场最高，建筑伤害也为夜魇最高；关键时段多次连续击杀。"}, {"player_slot": 132, "role": "团战接力", "reason": "兽 14/3/27，48,871 英雄伤害；35:57 买活、终局再收两人，持续参与推进阶段。"}, {"player_slot": 131, "role": "持盾推进", "reason": "刚背 9/11/27，34:26 持盾，6,759 建筑伤害；35—36 分钟收掉买活后的剑圣等人。"}]}, "players": [{"player_slot": 0, "comment": "破晓 7/10/14、38,037 伤害，火力并不低；41:15 最后防守再倒，这场的救场能力没能换成守成结果。"}, {"player_slot": 1, "comment": "Lion 1/21/16，38:00 买活、38:14 又死；复活券用得比击杀券勤，先复盘怎么活着交完控制。"}, {"player_slot": 2, "comment": "伐木机 10/12/15、33,012 伤害，确实打过不少还手；34:39 买活也没止住破路，输出账有，建筑账是零。"}, {"player_slot": 3, "comment": "不怪她／AMS 剑圣 13 杀为天辉最多，建筑伤害却只有 50；38 分钟双杀很亮，房子早已经被别人记账。"}, {"player_slot": 4, "comment": "Lich 3/17/19，两次买活还没保住高地；助攻不是没有，但十七次阵亡把后续防守的容错烧光了。"}, {"player_slot": 128, "comment": "屠夫 8/10/33，助攻全场最多；十次死亡得检讨，三十三次接力也不能从胜利账里抹掉。"}, {"player_slot": 129, "comment": "拉比克 9/7/32，和屠夫合计 65 助攻；Michael 的五连胜从辅助工种开工，首局并没靠核心数据抢镜。"}, {"player_slot": 130, "comment": "Lina 28/3/21，65,078 伤害还拆出 7,692；收人、输出、收房一起包，首局套餐确实管饱。"}, {"player_slot": 131, "comment": "刚背 9/11/27，死得多也拆得真；34:26 揣盾后参与破路，至少没把肉山奖品带回家当收藏。"}, {"player_slot": 132, "comment": "兽 14/3/27、48,871 伤害，35:57 买活后还有收尾击杀；夜魇火力表里，他是一直踩着的第二脚油门。"}], "item_comments": [{"time": "14:52／21:45", "player_slot": 132, "comment": "兽这两件到位后，夜魇持续压掉外塔；购买节点与推进阶段吻合，具体哪次开团靠了它仍需画面确认。", "item_name": "跳刀 → BKB"}, {"time": "21:55／37:52", "player_slot": 130, "comment": "Lina 在中段补机动性、终盘补控制，配合结算的输出与拆塔数据，装备路线和赢法连得上。", "item_name": "跳刀 → 羊刀"}, {"time": "24:44", "player_slot": 1, "comment": "Lion 有了进场工具，但全局 21 次阵亡说明买到跳刀并没有自动买到安全感。", "item_name": "跳刀"}], "buyback_comment": "最扎眼的反差：夜魇 Lina 34:41、兽 35:57 买活，后续破路和终局击杀都继续出现；天辉剑圣 36:09 买活后 36:33 再死，Lion 38:00 买活后十四秒再倒。复活币都花了，地图上的回报完全不同。", "closing": "天辉不是完全没打过架：剑圣、伐木机都换到人头。夜魇把火力接成了外塔、盾、两路兵营和最后五人清场，首局赢在贡献没有停在结算数字上。"}, "draft_html": "<section class=\"draft-board\" aria-label=\"完整队长模式 BP\"><div class=\"draft-team-head\"><div class=\"draft-team draft-radiant\"><strong class=\"draft-team-name\">天辉<\/strong><span class=\"draft-priority\">后选 · 末选<\/span><small class=\"draft-team-count\">本方 7 禁 · 5 选<\/small><div class=\"draft-roster\"><span class=\"draft-roster-player\">YourKing<\/span><span class=\"draft-roster-player\">噗噗猪<\/span><span class=\"draft-roster-player\">4ever4Seven<\/span><span class=\"draft-roster-player\">不怪她<\/span><span class=\"draft-roster-player\">勇敢牛牛<\/span><\/div><\/div><span class=\"draft-versus\">VS<\/span><div class=\"draft-team draft-dire\"><st , "is_radiant": false}, {"order": 22, "is_pick": false, "hero_id": 106, "is_radiant": true}, {"order": 23, "is_pick": true, "hero_id": 83, "is_radiant": false}, {"order": 24, "is_pick": true, "hero_id": 33, "is_radiant": true}], "editorial": {"match_id": 9036431333, "title": "牛牛的 Sven，把标准答案写出来了", "subtitle": "10 月 9 日 21:23 · 天辉获胜 · 33:09 · 44:20", "lead": "上一局死亡榜里的两位，这局一起迎来反弹：噗噗猪从 21 死降到 5 死，勇敢牛牛用 12/2/9 加 12,720 建筑伤害把胜局真正拆出来。", "bp_commentary": ["第 2 条夜魇禁掉上局 28 杀的 Lina，这个顺序事实很有话题；至于是不是针对具体玩家，回放摘要没有告诉我们。天辉同时禁破晓和兽，第一局的主要英雄有多位进入禁用。", "第 8 条夜魇首选宙斯，第 9 条天辉首选小强；之后夜魇拿凤凰、小鱼，天辉拿 Lich、Sven、蓝猫。阵容解读上，双方都具备打架和追击工具，关键看交换后谁能接推进。", "末手夜魇补大树、天辉补谜团。终局证明天辉的推进职责有人履行：Sven 与谜团合计 22,030 建筑伤害，不能把这场写成一个人的拆迁独角戏。"], "key_moments": [{"time": "15:07—15:54", "title": "夜魇也先拿了两座塔", "event": "天辉中路、下路一塔先后倒下。", "comment": "这局并不是从开场就单向平推；夜魇前段确实拿过地图收益，后面没有把这条线继续接长。"}, {"time": "17:16—17:35", "title": "七次阵亡的中段交换", "event": "天辉出现蓝猫、Lich 两次阵亡，夜魇五名英雄在这段内都被击杀；小强收掉凤凰和小鱼。", "comment": "双方都动手，但天辉拿到更多人头结果。这里可说交换优劣，不能补出一个没有验证的大招连段。"}, {"time": "26:20—26:56", "title": "下路从二塔直接拆到兵营", "event": "夜魇下二塔、高地塔、近战兵营、远程兵营连续被拆。", "comment": "天辉开始把团战收益写进地图，拆迁目标终于从塔外走到楼内。"}, {"time": "30:44—31:04", "title": "二十秒，夜魇五人全倒", "event": "Lich 收凤凰；Sven 收小鱼、大树、宙斯；小强收军团。小鱼 30:51 买活。", "comment": "勇敢牛牛在这一段拿三个人头；对面交出买活仍没中断攻势，天辉获得连续推进的窗口。"}, {"time": "31:37—33:10", "title": "团赢了，三路也跟着清了", "event": "中路兵营先倒，32:58 三路兵营清空，33:10 基地倒下。", "comment": "最后一波没散场去找野怪，楼跟着人一起收了。这才是本局 Sven 最值得复制的部分。"}], "mvp": {"label": "俱乐部 MVP · 可调整", "selected_slot": 1, "selection_reason": "Sven 12/2/9，低阵亡保住持续贡献；12,720 建筑伤害全场最高，30 分钟关键五人清场拿三个人头。选他是因为击杀和推进连在一起。", "candidates": [{"player_slot": 1, "role": "拆家终结者", "reason": "Sven 12/2/9，374 补刀、12,720 建筑伤害；关键清场贡献三杀，随后三路收尾。"}, {"player_slot": 3, "role": "双线贡献", "reason": "谜团 12/7/21，23,303 英雄伤害、9,310 建筑伤害；火力和拆楼都提供了可核对支持。"}, {"player_slot": 4, "role": "击杀接力", "reason": "小强 8/3/24；17 分钟收凤凰、小鱼，30:44 后的收尾阶段也有关键击杀，32 次击杀参与。"}]}, "players": [{"player_slot": 0, "comment": "Lich 4/5/25，30:44 先收凤凰；噗噗猪少死十六次，反弹这回有成绩单，不用靠嘴硬补分。"}, {"player_slot": 1, "comment": "Sven 12/2/9、建筑伤害 12,720；二十秒清场拿三杀，之后接着拆，牛牛终于把赢法写到基地上。"}, {"player_slot": 2, "comment": "蓝猫 8/3/11，31:27 被泉水收掉一条命；胜局可以开心，泉水这位第六人还是别去面试。"}, {"player_slot": 3, "comment": "谜团 12/7/21、9,310 建筑伤害；拆家第二大股东，不能看 Sven 抢镜就把你从产权表上删掉。"}, {"player_slot": 4, "comment": "小强 8/3/24，关键交换两次都有收尾；辅助工种继续赢，Michael 的打卡记录来到两连胜。"}, {"player_slot": 128, "comment": "军团 5/8/9，31:02 在最后清场中倒下；买到跳刀和 BKB，也没能把夜魇的反扑窗口撑出来。"}, {"player_slot": 129, "comment": "凤凰 8/10/8，为夜魇击杀最多；30:44 先被 Lich 带走，守高地最需要火力时，这个火力点先下线了。"}, {"player_slot": 130, "comment": "宙斯 2/9/9、16,446 伤害，电不是完全没打；人头和存活却接不上，最后还被 Sven 顺手带走。"}, {"player_slot": 131, "comment": "小鱼 3/7/6、6,984 伤害，30:51 买活还挡不住三路被清；复活一次，地图不会自动返还一次。"}, {"player_slot": 132, "comment": "大树 1/10/11，终局十次阵亡；树还在名单里，夜魇的塔和兵营已经从地图上退租了。"}], "item_comments": [{"time": "16:11／22:31", "player_slot": 1, "comment": "Sven 在中段补齐进场与抗干扰工具，随后 26 分钟破路、30 分钟连续击杀；能确认节点和结果，具体使用需要画面核验。", "item_name": "跳刀 → BKB"}, {"time": "19:04", "player_slot": 3, "comment": "谜团有了重要的机动工具；本报告用 12/7/21 和 9,310 拆塔评价贡献，不编造某一波拉了几个人。", "item_name": "跳刀"}, {"time": "27:18", "player_slot": 131, "comment": "小鱼买到紫怨时，自家下路已经被破；装备补上了，之前失去的推进节奏仍没有补回来。", "item_name": "紫怨"}], "buyback_comment": "事件流只记录到夜魇小鱼 30:51 这次买活。30:44—31:04 队友仍连续阵亡，之后兵营接连倒下；这张复活券没能变成停止推进的车票。本局没有肉山事件，胜利不归因于一个未记录的盾。", "closing": "Sven 给出了主 C 的有效答卷，谜团也提供了第二份拆塔账。噗噗猪活得更久、小强接得更勤，五人贡献终于一起通向了结算页。"}, "draft_html": "<section class=\"draft-board\" aria-label=\"完整队长模式 BP\"><div class=\"draft-team-head\"><div class=\"draft-team draft-radiant\"><strong class=\"draft-team-name\">天辉<\/strong><span class=\"draft-priority\">后选 · 末选<\/span><small class=\"draft-team-count\">本方 7 禁 · 5 选<\/small><div class=\"draft-roster\"><span class=\"draft-roster-player\">噗噗猪<\/span><span class=\"draft-roster-player\">勇敢牛牛<\/span><span class=\"draft-roster-player\">AMS<\/span><span class=\"draft-roster-player\">缩小我的身体握住在你手里<\/span><span class=\"draft-roster-player\">Michael Myers<\/span><\/div><\/div><span class=\"draft-versus\">VS<\/span><div class=\" ": 21, "is_pick": false, "hero_id": 60, "is_radiant": false}, {"order": 22, "is_pick": false, "hero_id": 106, "is_radiant": true}, {"order": 23, "is_pick": true, "hero_id": 128, "is_radiant": false}, {"order": 24, "is_pick": true, "hero_id": 26, "is_radiant": true}], "editorial": {"match_id": 9036525556, "title": "斧王收人，剑圣收楼", "subtitle": "10 月 9 日 22:16 · 夜魇获胜 · 41:27 · 50:22", "lead": "ATM33 斧王 20 杀，4ever 电炎绝手只死一次，Michael 的剑圣却靠 14,505 建筑伤害把胜利真正落地。三种贡献刚好连成一条线。", "bp_commentary": ["夜魇第 8 条首选小仙女，天辉第 9 条选 Lich；接着天辉拿撼地者，夜魇拿沉默和剑圣。控制点与团战工具都不少，阵容分析不能替代对实际技能命中的验证。", "第 16—18 条依次是天辉拉比克、天辉猴子、夜魇斧王。天辉有猴子的后续输出路线，夜魇已有斧王配剑圣的近身作战组合。", "末手夜魇补电炎绝手，天辉补 Lion。实战最明显的差距，是夜魇形成斧王 20 杀、电炎绝手 40,146 伤害、剑圣 14,505 拆塔的分工，天辉没能接出同样的收益链。"], "key_moments": [{"time": "20:44", "title": "天辉三座一塔全失", "event": "夜魇此前在 9:04、19:33、20:44 拆掉天辉下、中、上路一塔。", "comment": "比赛还没到高地，天辉可用的外塔已经全部退出；后续刷钱和防守必须面对更小的地图。"}, {"time": "31:37—32:26", "title": "双买活，确实打出过还手", "event": "七次阵亡；撼地者 32:02、Lich 32:07 买活，撼地者在 32:26 再杀沉默，猴子也击杀斧王。", "comment": "这波不是毫无抵抗，天辉付钱后确实换回击杀；但进攻主动权没有因此彻底易手。"}, {"time": "34:25", "title": "剑圣拿盾，推进准备完成", "event": "夜魇击杀肉山，Michael Myers 的剑圣拿到不朽盾。", "comment": "终局建筑伤害最高的人拿到了盾，推进资源和实际拆塔手终于落到同一个账号上。"}, {"time": "37:06—39:29", "title": "三人倒下，三路随后清空", "event": "斧王先杀 Lich、拉比克，剑圣再杀撼地者；37:40—39:29 天辉六座兵营全部倒下。", "comment": "斧王负责让防线减员，剑圣负责把房子收掉；这段才是第三局最完整的胜负转换。"}, {"time": "41:06—41:28", "title": "最后有交换，基地没续上", "event": "双方最后仍互有人头，天辉也击杀剑圣、电炎绝手、沉默；两座四塔已倒，41:28 基地告终。", "comment": "末段人头交换不等于翻盘窗口。六座兵营早已清空，反击没能把建筑损失撤销。"}], "mvp": {"label": "俱乐部 MVP · 可调整", "selected_slot": 128, "selection_reason": "斧王 20/3/21，持续出现在关键击杀记录里；37:06—37:08 连收两名防守者后，夜魇进入连续破路。选择 ATM33 看的是关键减员与稳定参与，推进奖另给剑圣。", "candidates": [{"player_slot": 128, "role": "关键减员", "reason": "斧王 20/3/21，全场击杀最高、41 次击杀参与；破路前连收天辉两人，为最终阶段提供实质结果。"}, {"player_slot": 129, "role": "持续火力", "reason": "电炎绝手 13/1/25，40,146 英雄伤害为全场最高；只死一次，火力和存活都十分扎实。"}, {"player_slot": 131, "role": "推进功臣", "reason": "剑圣 7/4/9，34:25 持盾、14,505 建筑伤害；个人击杀没霸榜，拆楼贡献却全场第一。"}]}, "players": [{"player_slot": 0, "comment": "拉比克 5/12/8，31:37 和 37:08 两次关键阵亡；上局 Sven 的胜利模板，换个英雄不会自动继承。"}, {"player_slot": 1, "comment": "Lich 0/16/16，32:07 买活仍没撑住破路；有助攻，复活倒计时也太忙，这回又把自己送回死亡榜。"}, {"player_slot": 2, "comment": "猴子 4/6/4、434 补刀、净值 23,112，建筑伤害只有 111；钱确实攒起来了，真正能接团拆家的窗口没有到手。"}, {"player_slot": 3, "comment": "撼地者 6/9/13、28,052 伤害，买活后还反杀沉默；反抗记录真实存在，37:17 再倒后防线仍被收干净。"}, {"player_slot": 4, "comment": "Lion 7/7/7，为天辉击杀最多；一个辅助把七杀刷出来了，队伍仍没找到把交换转成推进的路线。"}, {"player_slot": 128, "comment": "斧王 20/3/21，37 分钟连续杀两人后接三路破；本局斧头够硬，ATM33 把核心戏份真的扛住了。"}, {"player_slot": 129, "comment": "电炎绝手 13/1/25、40,146 伤害；上局小鱼七次阵亡，这局只交一次，火力天气从阵雨改成持续轰炸。"}, {"player_slot": 130, "comment": "小仙女 2/8/28，击杀不抢镜、助攻真不少；别把二杀理解成没做事，二十八次接力也是账。"}, {"player_slot": 131, "comment": "剑圣 7/4/9、14,505 建筑伤害、34:25 持盾；KDA 像配角，楼的产权变更记录全是他的指纹。"}, {"player_slot": 132, "comment": "沉默 7/6/28，38:25、38:37 连收猴子和拉比克；七杀二十八助攻，给队伍的推进接了最后几段电。"}], "item_comments": [{"time": "15:27／25:51", "player_slot": 128, "comment": "斧王在中段完成关键进场装备，后面仍持续参与击杀；评价建立在事件和终局数据上，不把某一杀强行归因于跳刀。", "item_name": "跳刀 → BKB"}, {"time": "26:09／30:54", "player_slot": 129, "comment": "电炎绝手在拿盾前已经补出两件大装备，最终全场最高伤害且只死一次，火力与存活都有结果。", "item_name": "希瓦 → BKB"}, {"time": "31:28／39:44", "player_slot": 131, "comment": "剑圣后段继续补强装备；和 480 补刀、14,505 建筑伤害一起看，推进担当不是只领了一个盾的名誉职位。", "item_name": "分身斧 → 迅疾闪光"}], "buyback_comment": "天辉撼地者和 Lich 在 32 分钟双买活，确实帮助换回人头；这笔钱没有完全白花。但三分钟后盾仍属于夜魇，37 分钟三名防守者接连阵亡，双命没能买回持续推进的主动权。", "closing": "第三局的胜利由三份成绩拼起来：斧王制造关键减员，电炎绝手提供持续火力，剑圣把建筑拆完。只按击杀数选人，会漏掉真正负责收尾的拆迁队。"}, "draft_html": "<section class=\"draft-board\" aria-label=\"完整队长模式 BP\"><div class=\"draft-team-head\"><div class=\"draft-team draft-radiant\"><strong class=\"draft-team-name\">天辉<\/strong><span class=\"draft-priority\">后选 · 末选<\/span><small class=\"draft-team-count\">本方 7 禁 · 5 选<\/small><div class=\"draft-roster\"><span class=\"draft-roster-player\">勇敢牛牛<\/span><span class=\"draft-roster-player\">噗噗猪<\/span><span class=\"draft-roster-player\">AMS<\/span><span class=\"draft-roster-player\">缩小我的身体握住在你手里<\/span> r": 20, "is_pick": false, "hero_id": 106, "is_radiant": true}, {"order": 21, "is_pick": false, "hero_id": 96, "is_radiant": false}, {"order": 22, "is_pick": false, "hero_id": 74, "is_radiant": true}, {"order": 23, "is_pick": true, "hero_id": 17, "is_radiant": false}, {"order": 24, "is_pick": true, "hero_id": 36, "is_radiant": true}], "editorial": {"match_id": 9039492500, "title": "炸弹人 19 杀，死灵法稳住另一半", "subtitle": "10 月 11 日 15:13 · 天辉获胜 · 30:33 · 51:17", "lead": "THX. 的炸弹人最抢镜，旋风冲锋龙卷风的死灵法 14/2/12 同样扎实。天辉七分钟就开始拆塔，终盘买活后继续收人，把 51:17 尽快变成了基地结算。", "bp_commentary": ["夜魇开段禁小强和小鱼，天辉禁白牛和飞机；第 8、9 条分别首选 Ogre 和 Lich。先拿辅助工具，再往后补核心，是这局数组里能直接看到的结构。", "天辉先后补火枪、炸弹人、巨魔，夜魇拿 Sven、伐木机、谜团。阵容解读上，天辉有远程火力与拆塔核心，夜魇具备冲脸和团战工具；不能凭纸面阵容就断言哪次操作出了错。", "最后两选是夜魇蓝猫、天辉死灵法。补完后，实战由炸弹人 40,083 伤害、死灵法 30,609 伤害构成主要火力，夜魇没有把自己这套近身压力兑现成足够的地图结果。"], "key_moments": [{"time": "07:10—07:54", "title": "七分钟，中上两塔先没了", "event": "天辉拆掉夜魇中、上路一塔。", "comment": "第四局推进起步很早，夜魇不只是在等后期团战，还得先处理不断减少的外塔。"}, {"time": "17:25—17:38", "title": "死灵法连收三人", "event": "死灵法击杀伐木机、蓝猫、Ogre，巨魔期间收掉谜团。", "comment": "十三秒里夜魇四名英雄阵亡，稳定第二火力点的价值在这里很明确；THX. 抢镜，但不是一个人做完所有工作。"}, {"time": "26:21—27:52", "title": "盾给巨魔，外塔清完", "event": "天辉击杀肉山，AMS 巨魔持盾；27:52 夜魇最后一座二塔倒下。", "comment": "天辉带着盾继续拿地图资源；比分领先最终有了直接通向高地的道路。"}, {"time": "28:49—28:53", "title": "三张复活券同时翻桌", "event": "谜团 28:49、炸弹人 28:50、Ogre 28:53 买活；伐木机随后 29:48 也买活。", "comment": "末段双方都投入了额外一条命。胜方也需要买活接力，这局并没有简单到不必付最后一笔账。"}, {"time": "29:42—30:33", "title": "七次交换，天辉最后关门", "event": "夜魇击杀火枪；天辉拿到六次击杀，炸弹人收伐木机、蓝猫，巨魔收三人，死灵法收 Sven；30:33 基地倒下。", "comment": "THX. 买活后仍有两杀，AMS 也用持盾后的终局贡献盖章。夜魇的回手没有把地图拉回来。"}], "mvp": {"label": "俱乐部 MVP · 可调整", "selected_slot": 0, "selection_reason": "炸弹人 19/7/21，40,083 英雄伤害全场最高；28:50 买活后在末段再杀伐木机、蓝猫。THX. 的火力与收尾事件都有实证，因此略先于稳定的死灵法；七次阵亡也保留在评价里。", "candidates": [{"player_slot": 0, "role": "火力与收尾", "reason": "炸弹人 19/7/21，40,083 英雄伤害；末段买活后两次关键击杀，贡献没有因阵亡完全断开。"}, {"player_slot": 3, "role": "稳定骨架", "reason": "死灵法 14/2/12，30,609 英雄伤害、GPM 808；17 分钟连收三人，低死亡保持持续贡献。"}, {"player_slot": 1, "role": "持盾终结", "reason": "巨魔 6/3/16，26:21 持盾，终局收谜团、Ogre、伐木机；2,513 建筑伤害参与推进。"}]}, "players": [{"player_slot": 0, "comment": "炸弹人 19/7/21、40,083 伤害，买活后再收两人；炸得响也死了七次，镜头给足，改进空间照留。"}, {"player_slot": 1, "comment": "巨魔 6/3/16，26:21 持盾，终局阶段再收三人；人头没刷爆，收工章却盖得很实在。"}, {"player_slot": 2, "comment": "Lich 5/3/21，阵亡少、协作多；这局安静但稳定，唤水剑没有把辅助位当复活倒计时体验卡。"}, {"player_slot": 3, "comment": "死灵法 14/2/12、30,609 伤害，十七分钟连收三人；炸弹人抢了标题，你把这场的稳定底盘守住了。"}, {"player_slot": 4, "comment": "火枪 7/2/11、4,534 建筑伤害全场最多；Michael 这局没抢人头榜，仍拿着拆楼账收下第四胜。"}, {"player_slot": 128, "comment": "谜团 0/13/10，20:26 买跳刀、28:49 买活；十三次阵亡已经够开会，不需要靠编造空大来加罪名。"}, {"player_slot": 129, "comment": "Sven 4/5/5、建筑伤害 0；同一个英雄从第二局拆 12,720 到这局碰不到楼，得一起复盘队伍怎么把前段压力接住。"}, {"player_slot": 130, "comment": "Ogre 2/16/8，28:53 买活后 30:00 再倒；连续两局十六死，肉一点并不附赠无限续杯。"}, {"player_slot": 131, "comment": "伐木机 5/8/2、19,487 伤害，29:48 买活、30:12 又死；有火力，最后一条命没能帮防线延长账期。"}, {"player_slot": 132, "comment": "蓝猫 6/9/7，为夜魇击杀最多，29:43 还收火枪；一个人的反击是真的，二十九秒后防线继续倒也是真的。"}], "item_comments": [{"time": "18:06／23:15／25:41", "player_slot": 3, "comment": "死灵法持续补机动、团战与保命装备，终局只死两次；这条装备路线和他的稳定表现能互相印证。", "item_name": "跳刀 → 希瓦 → 永恒之盘"}, {"time": "20:26", "player_slot": 128, "comment": "谜团的关键机动件较晚到位，终局 23 补刀、净值 5,059；经济和生存都紧，不把整场责任压到一次未验证的大招上。", "item_name": "跳刀"}, {"time": "29:16", "player_slot": 132, "comment": "蓝猫在比赛结束前一分多钟买到 BKB，之后仍有反击击杀，最终没翻过来；关键道具到了，局面也已经很窄。", "item_name": "BKB"}], "buyback_comment": "最有结果的复活券属于炸弹人：28:50 买活，29:45、29:52 连续击杀。夜魇也交了谜团、Ogre、伐木机三次买活，但末段仍连续倒下；这里只评价复活后的结果，不猜未恢复的走位和连招。", "closing": "天辉由炸弹人负责最大火力、死灵法负责稳定输出，巨魔带盾接终局，火枪贡献全场最多建筑伤害。51:17 的优势最后被持续推进兑现，MVP 可以有争论，贡献证据都摆在这里。"}, "draft_html": "<section class=\"draft-board\" aria-label=\"完整队长模式 BP\"><div class=\"draft-team-head\"><div class=\"draft-team draft-radiant\"><strong class=\"draft-team-name\">天辉<\/strong><span class=\"draft-priority\">后选 · 末选<\/span><small class=\"draft-team-count\">本方 7 禁 · 5 选<\/small><div class=\"draft-roster\"><span class=\"draft-roster-player\">THX.<\/span><span class=\"draft-roster-player\">AMS<\/s iant": false}, {"order": 19, "is_pick": false, "hero_id": 135, "is_radiant": false}, {"order": 20, "is_pick": false, "hero_id": 15, "is_radiant": true}, {"order": 21, "is_pick": false, "hero_id": 96, "is_radiant": false}, {"order": 22, "is_pick": false, "hero_id": 76, "is_radiant": true}, {"order": 23, "is_pick": true, "hero_id": 22, "is_radiant": false}, {"order": 24, "is_pick": true, "hero_id": 1, "is_radiant": true}], "editorial": {"match_id": 9039548829, "title": "帕格纳买活，三核赶着拆楼", "subtitle": "10 月 11 日 16:01 · 天辉获胜 · 27:14 · 33:14", "lead": "第五局最该看的数字是 30,070：帕格纳、卡尔、敌法的建筑伤害之和。关键高地交换里 nini 买活立刻双杀，队伍没停下来等下一班车。", "bp_commentary": ["夜魇开段禁炸弹人和米拉娜，天辉禁白牛、凤凰等；第 8 条夜魇首选 Sven，第 9 条天辉首选虚空。双方很早就把一名重要近战核心摆上桌。", "随后天辉拿卡尔、帕格纳、Ogre，夜魇拿天怒、拉比克、酒仙。阵容解读上，两边都有团战配合工具；天辉的具体优势还要靠最后一名英雄和实战推进来兑现。", "末手夜魇补宙斯，天辉补敌法。纸面上是多个需要资源的英雄同场，实际 27 分钟就结束：帕格纳、卡尔、敌法全都打出了大量建筑伤害，所以这次多核心没有只停在刷钱阶段。"], "key_moments": [{"time": "12:17—15:31", "title": "夜魇三座一塔全部退出", "event": "中、下、上路一塔依次倒下。", "comment": "第五局没有一路慢慢磨的舒适区，天辉把三条线的地图资源都往前推。"}, {"time": "21:03", "title": "所有二塔也拆完", "event": "夜魇上路二塔倒下，三座二塔全部失守。", "comment": "天辉的外塔阶段已经交卷；事件流没有肉山记录，依然进入连续破路。"}, {"time": "23:47—24:58", "title": "九次阵亡，高地不停交换", "event": "天辉击杀六名英雄人次、夜魇拿到三次；上下路高地塔和多座兵营同时倒下。", "comment": "不是没有代价的推进，虚空、帕格纳、Ogre都有阵亡；关键是进攻方的人头与建筑收益一起在增加。"}, {"time": "24:51—24:58", "title": "一秒买活，回来就双杀", "event": "天怒 24:51 击杀帕格纳；nini 24:52 买活，24:54 杀 AMS、24:58 杀唤水剑。", "comment": "可确认的是回场后的连续击杀，不补传送细节。复活币没有花成散步券，守家两人被再次送回泉水。"}, {"time": "25:41—27:14", "title": "三路拆完，终局直接结账", "event": "25:41 六座兵营全部倒下；26:55 Sven、26:58 虚空买活，27:14 基地结束。", "comment": "最后还有双方击杀和买活，三路已经清空，天辉没有再把比赛拖成下一轮刷钱竞赛。"}], "mvp": {"label": "俱乐部 MVP · 可调整", "selected_slot": 2, "selection_reason": "帕格纳 9/4/20，27,215 英雄伤害全场最高、8,387 建筑伤害；24:52 买活立刻双杀让关键推进持续。敌法拆楼最多、卡尔击杀最多，选择 nini 是因为战斗、推进和关键买活三项都有证据。", "candidates": [{"player_slot": 2, "role": "推进接力", "reason": "帕格纳 9/4/20、27,215 英雄伤害、8,387 建筑伤害；关键买活后双杀，提供最鲜明的转折证据。"}, {"player_slot": 4, "role": "拆楼第一", "reason": "敌法 7/1/6，12,377 建筑伤害全场最高，GPM 708；只死一次，五连胜最后一局的建筑功臣。"}, {"player_slot": 3, "role": "杀拆兼顾", "reason": "卡尔 11/3/7，天辉击杀最多、9,306 建筑伤害；24 分钟连续收宙斯和 Sven，为高地交换提供结果。"}]}, "players": [{"player_slot": 0, "comment": "Ogre 2/3/14，全周最少阵亡的一场；噗噗猪终于把复活倒计时放了假，队友拆楼也拆得安稳。"}, {"player_slot": 1, "comment": "虚空 4/3/14，26:58 买活参与最后阶段；不用编造完美大招，换了角色以后仍有十八次击杀参与和一场胜利。"}, {"player_slot": 2, "comment": "帕格纳 9/4/20，买活后两次击杀就在六秒内；nini 只来一局，复活币就花成了推进续费卡。"}, {"player_slot": 3, "comment": "卡尔 11/3/7、拆塔 9,306，人头与房产两边都记账；Yiki 这局的还手终于变成了主动拆家。"}, {"player_slot": 4, "comment": "敌法 7/1/6、12,377 建筑伤害；五连胜终章只死一次，Michael 最后交的是拆迁验收单。"}, {"player_slot": 128, "comment": "Sven 5/4/2，26:55 买活、27:04 还反杀敌法；最后反击不虚，但三路兵营已经全没，时间不会倒流。"}, {"player_slot": 129, "comment": "酒仙 1/11/1，04:53 就买活；全局只两次击杀参与，十一张死亡账单，这把确实需要重点回看。"}, {"player_slot": 130, "comment": "天怒 6/6/4、17,302 伤害，24:51 确实杀了 nini；对方付完复活币立刻双杀，杀到人没等于防守成功。"}, {"player_slot": 131, "comment": "宙斯 1/8/5，24:32 买活、24:54 再倒；同样一张复活券，对面拿来续推，你这张没换出喘气时间。"}, {"player_slot": 132, "comment": "拉比克 0/4/6，24:58 被买活后的帕格纳击杀；前局 Lich 的二十一助攻热闹，这局没有接出同样协作场面。"}], "item_comments": [{"time": "16:05", "player_slot": 1, "comment": "虚空选择了功能装备；结合十八次击杀参与看有团队贡献，仍不推断具体哪次反弹改变了团战。", "item_name": "莲花"}, {"time": "19:24", "player_slot": 4, "comment": "敌法在 20 分钟前买到分身斧，21 分钟外塔清空；终局 292 补刀、12,377 建筑伤害，发育最终确实交付到了建筑。", "item_name": "分身斧"}, {"time": "26:52", "player_slot": 0, "comment": "Ogre 买到笛子距离基地倒下只有二十二秒；它是终局装备事实，不能吹成前面二十分钟的决定性道具。", "item_name": "笛子"}], "buyback_comment": "两张复活券最适合对照：AMS 24:32 买活，24:54 再死；nini 24:52 买活，24:54、24:58 拿两杀。事件只证明先后和结果，已经足够锐评；Sven 26:55 买活后还杀敌法，努力真实，但三路已经全被拆完。", "closing": "这局的 MVP 有三种合理看法：nini 的关键接力、Michael 的拆楼第一、Yiki 的杀拆兼顾。这里把主奖给帕格纳，同时把三人的 30,070 建筑伤害摆出来；胜利不是一张 KDA 截图能讲完的。"}, "draft_html": "<section class=\"draft-board\" aria-label=\"完整队长模式 BP\"><div class=\"draft-team-head\"><div class=\"draft-team draft-radiant\"><strong class=\"draft-team-name\">天辉<\/strong><span class=\"draft-priority\">后选 · 末选<\/span><small class=\"draft-team-count\">本方 7 禁 · 5 选<\/small><div class=\"draft-roster\"><span class=\"draft-roster-p  建筑伤害，缩小我的身体握住在你手里把输出和收房同时做了。"}, {"title": "反弹最猛 · 噗噗猪 · 21 死 → 5 死", "body": "首局 Lion 1/21/16，第二局 Lich 4/5/25。少躺十六次，比在群里立十六个军令状好使。"}, {"title": "最快下班 · 第五局 · 27:14", "body": "帕格纳、卡尔、敌法合计 30,070 建筑伤害；这班车到站快，因为三个人都知道该往楼上使劲。"}], "pairs": [{"names": "THX. × Michael Myers", "games": 3, "wins": 3, "comment": "本周同队三场全胜：兽＋拉比克、炸弹人＋火枪、虚空＋敌法。THX. 提供团战存在感，Michael 在核心局把建筑账结了；这是五人队中的同队结果。"}, {"names": "勇敢牛牛 × 噗噗猪", "games": 4, "wins": 1, "comment": "四次同队只赢第二局。那局 Sven 12/2/9，Lich 4/5/25；其他三局合计两人死亡不少。值得复制的是那次赢团接推进的节奏。"}, {"names": "王鹤没有棣 × 。", "games": 3, "wins": 2, "comment": "两场胜局，刚背／小仙女配屠夫／沉默；第三局合计 56 助攻。没有天天霸占人头榜，但确实在给队伍接力。"}], "players": [{"name": "Michael Myers", "games": 5, "wins": 5, "kda": "38/17/82", "comment": "五英雄五连胜。辅助局助攻到位，核心局建筑伤害过万，换位以后没有把脑子落在上个英雄身上。"}, {"name": "AMS（首局“不怪她”）", "games": 5, "wins": 2, "kda": "32/30/43", "comment": "剑圣 13 杀只拆 50，巨魔 6 杀却带盾赢；本周最直观的教材：人头榜第一行不负责自动拆基地。"}, {"name": "勇敢牛牛", "games": 5, "wins": 1, "kda": "29/40/43", "comment": "第二局 Sven 12/2/9、建筑伤害 12,720，第四局同英雄 4/5/5、建筑伤害 0；标准答案已经写过一遍，下一次得把步骤也复制下来。"}, {"name": "噗噗猪", "games": 5, "wins": 2, "kda": "9/61/79", "comment": "五局 61 次阵亡，Lion 21 死、Lich 16 死、Ogre 16 死都上榜；末局 2/3/14 赢得清爽，复活倒计时真不用收集全套。"}, {"name": "THX.", "games": 4, "wins": 3, "kda": "45/23/70", "comment": "兽 14/3/27、炸弹人 19/7/21，末局虚空 4/3/14 也赢；能抢镜，也能在别人拆楼时把配角演完整。"}, {"name": "4ever4Seven", "games": 3, "wins": 1, "kda": "26/20/46", "comment": "小鱼 3/7/6，下一局电炎绝手 13/1/25。对手最怕的不是你一直往里游，是你站得住、把火力持续交出来。"}, {"name": "ATM33", "games": 3, "wins": 1, "kda": "26/22/24", "comment": "斧王 20/3/21 是本周正片，伐木机 5/8/2 和酒仙 1/11/1 是后续花絮；酒仙一局的 11 次死亡值得单开复盘。"}, {"name": "YourKing", "games": 3, "wins": 0, "kda": "19/25/30", "comment": "破晓 38,037 伤害、Lion 7 杀都有参与感，三场仍全败；个人努力能看见，团战之后地图却始终没向自家走。"}, {"name": "。", "games": 3, "wins": 2, "kda": "16/26/72", "comment": "屠夫 33 助攻、沉默 28 助攻，赢局一直有他；大树 1/10/11 那局没守住楼，树林也得跟着交物业。"}, {"name": "王鹤没有棣", "games": 3, "wins": 2, "kda": "13/28/64", "comment": "刚背持盾推进，小仙女 28 助攻，宙斯 2/9/9 则失速；这周最有效的贡献是接住队友的团战，把推进送到下一站。"}, {"name": "缩小我的身体握住在你手里", "games": 3, "wins": 2, "kda": "46/19/55", "comment": "Lina 28 杀，谜团还拆了 9,310；撼地者买活继续反杀也没翻。两场胜局的火力很硬，败局也留有真反抗记录。"}, {"name": "Yiki", "games": 2, "wins": 1, "kda": "17/12/14", "comment": "蓝猫 6/9/7 后换卡尔 11/3/7、拆塔 9,306。上一局在找反击口，下一局直接把对方房产证拿走了。"}, {"name": "唤水剑", "games": 2, "wins": 1, "kda": "5/7/27", "comment": "Lich 5/3/21 是第四局的低调连接器，拉比克 0/4/6 却没接住末局；英雄换了，队伍给你的发挥空间也换了。"}, {"name": "旋风冲锋龙卷风", "games": 2, "wins": 1, "kda": "20/8/16", "comment": "死灵法 14/2/12、30,609 伤害赢，天怒 6/6/4 输；末局确实杀了帕格纳，奈何对方复活币付完就回来继续收房。"}, {"name": "PanGod", "games": 1, "wins": 0, "kda": "0/13/10", "comment": "谜团 0/13/10、20:26 才买到跳刀；不用编造空大，十三次阵亡已经足够开一次生存复盘。"}, {"name": "nini.(C=x+y)", "games": 1, "wins": 1, "kda": "9/4/20", "comment": "帕格纳 27,215 英雄伤害、8,387 建筑伤害，买活立刻双杀；只上一场，就把这周最值的复活币花出来了。"}], "closing": "五局的共同答案：拿到人头只是开门，塔、兵营、基地才是交卷。谁把团战收益换成建筑，谁的胜利结算就更有说服力。五局样本适合聊本周状态，不用来预测长期胜率。"}, "unique_players": 16, "appearance_count": 50, "quality_note": "数据来自本批五场回放；MVP 为本期战报评选。"}</script><script src="report.js"></script></body></html>
